<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Work Log Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; }
        .disabled-row {
            background-color: #f1f3f5 !important;
            opacity: 0.85;
        }
        .payment-details {
            font-size: 0.8rem;
            color: #198754;
            font-weight: 600;
        }
        .box-count {
            font-size: 0.9rem;
        }
        /* Document header and footer rules configured explicitly for the PDF layout */
        .pdf-header {
            display: none;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .pdf-footer {
            display: none;
            margin-top: 30px;
            font-size: 0.8rem;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="mb-0"><i class="bi bi-plus-circle-fill me-2"></i>Log Offloading Work</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="workLogForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Employee Name</label>
                                <input type="text" id="employeeName" class="form-control" placeholder="e.g., John Doe" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Vehicle Number Plate</label>
                                <input type="text" id="vehiclePlate" class="form-control" placeholder="e.g., KAA 123A" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Date of Work</label>
                                <input type="date" id="dateWorked" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Total Boxes Removed</label>
                                <input type="number" id="totalBoxes" class="form-control" min="0" placeholder="Total offloaded boxes" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Boxes Supposed to be Paid</label>
                                <input type="number" id="paidBoxes" class="form-control" min="0" placeholder="Boxes to pay for" required>
                            </div>
                            <button type="submit" id="submitBtn" class="btn btn-success w-100 py-2 fw-bold">Save Record</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm border-0 sticky-top" style="top: 20px;">
                    <div class="card-header bg-info text-white py-3">
                        <h5 class="mb-0"><i class="bi bi-file-earmark-pdf-fill me-2"></i>Generate PDF Report</h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Filter by Employee Name</label>
                            <input type="text" id="filterName" class="form-control" placeholder="Leave blank for all employees">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Start Date</label>
                            <input type="date" id="filterStartDate" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">End Date</label>
                            <input type="date" id="filterEndDate" class="form-control">
                        </div>
                        <button type="button" class="btn btn-dark w-100 py-2 fw-bold" onclick="generatePDF()">
                            <i class="bi bi-download me-2"></i>Download PDF Report
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm border-0" id="pdfPrintArea">
                    
                    <div class="pdf-header" id="pdfHeader">
                        <h2 style="color: #0d6efd; margin-bottom: 5px;">Work Log Summary Report</h2>
                        <p style="margin: 0; color: #555;" id="pdfMetadata">Generated on: </p>
                    </div>

                    <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center no-print">
                        <h5 class="mb-0">
                            <i class="bi bi-collection-fill me-2"></i>Shared Work Logs 
                            <span id="loadingSpinner" class="badge bg-warning text-dark ms-2">Loading cloud...</span>
                        </h5>
                        <button class="btn btn-outline-danger btn-sm text-white" onclick="clearAllData()">Clear All Cloud Records</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" id="mainLogsTable">
                                <thead class="table-light">
                                    <tr>
                                        <th>Employee / Vehicle</th>
                                        <th>Date Worked</th>
                                        <th>Boxes Layout</th>
                                        <th>Status & Payment Details</th>
                                        <th class="text-center no-print">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="logTableBody">
                                    </tbody>
                            </table>
                        </div>
                        <div id="noDataMessage" class="text-center py-5 text-muted">
                            <i class="bi bi-folder-x display-4 d-block mb-2"></i>
                            No records found. Enter details on the left to save.
                        </div>
                    </div>

                    <div class="pdf-footer" id="pdfFooter">
                        <p>Work Log Management System — End of Report</p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // Integrated your specific production URL endpoint directly 
        const FIREBASE_URL = "https://work-log-system-f1a6b-default-rtdb.europe-west1.firebasedatabase.app/";

        // Runtime local cache lookup list
        let globalLogsArray = [];

        document.getElementById('dateWorked').valueAsDate = new Date();

        // Listen for form submission
        document.getElementById('workLogForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Saving to Cloud...";

            const employeeName = document.getElementById('employeeName').value.trim();
            const vehiclePlate = document.getElementById('vehiclePlate').value.trim();
            const dateWorked = document.getElementById('dateWorked').value;
            const totalBoxes = parseInt(document.getElementById('totalBoxes').value, 10);
            const paidBoxes = parseInt(document.getElementById('paidBoxes').value, 10);

            const recordId = "log_" + Date.now(); 

            const newLog = {
                id: recordId, 
                employeeName,
                vehiclePlate,
                dateWorked, 
                totalBoxes,    
                paidBoxes,     
                isPaid: false,
                amountPaid: 0,    
                datePaid: null    
            };

            // Write into your custom Europe cloud node path via direct rest calls
            fetch(`${FIREBASE_URL}logs/${recordId}.json`, {
                method: 'PUT',
                body: JSON.stringify(newLog),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(() => {
                document.getElementById('employeeName').value = '';
                document.getElementById('vehiclePlate').value = '';
                document.getElementById('totalBoxes').value = '';
                document.getElementById('paidBoxes').value = '';
                
                submitBtn.disabled = false;
                submitBtn.innerHTML = "Save Record";
                
                fetchLogsFromCloud(); 
            })
            .catch(error => {
                console.error("Firebase Error: ", error);
                alert("Cloud sync failure. Please review database access rules setup.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = "Save Record";
            });
        });

        // Pull collection logs matrix data down from shared node roots
        function fetchLogsFromCloud() {
            const spinner = document.getElementById('loadingSpinner');
            if(spinner) {
                spinner.classList.remove('d-none');
                spinner.innerText = "Loading cloud...";
            }

            fetch(`${FIREBASE_URL}logs.json`)
            .then(response => response.json())
            .then(data => {
                globalLogsArray = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        if(data[key] !== null) {
                            globalLogsArray.push(data[key]);
                        }
                    });
                }
                if(spinner) spinner.classList.add('d-none');
                displayLogs();
            })
            .catch(error => {
                console.error("Fetch failed: ", error);
                if(spinner) {
                    spinner.classList.remove('d-none');
                    spinner.innerText = "Offline Mode";
                }
            });
        }

        // Render sorted row list dynamically
        function displayLogs(filteredData = null) {
            const currentLogs = filteredData || globalLogsArray;
            const tableBody = document.getElementById('logTableBody');
            const noDataMessage = document.getElementById('noDataMessage');

            tableBody.innerHTML = '';

            if (currentLogs.length === 0) {
                noDataMessage.classList.remove('d-none');
                return;
            } else {
                noDataMessage.classList.add('d-none');
            }

            currentLogs.sort((a, b) => {
                if (a.dateWorked < b.dateWorked) return 1;
                if (a.dateWorked > b.dateWorked) return -1;
                return 0;
            });

            currentLogs.forEach(log => {
                let rowClass = "";
                let statusAndPaymentCell = "";
                let deleteActionCell = "<td class='no-print'></td>"; 

                if (log.isPaid) {
                    rowClass = "class='disabled-row'";
                    
                    statusAndPaymentCell = `
                        <div>
                            <span class="badge bg-success text-uppercase mb-1"><i class="bi bi-check-circle-fill me-1"></i> Paid</span>
                        </div>
                        <div class="payment-details">
                            <i class="bi bi-cash-stack me-1"></i> Total: <strong>Ksh ${Number(log.amountPaid).toLocaleString()}</strong><br>
                            <i class="bi bi-calendar-check me-1"></i> Paid On: ${formatDateDisplay(log.datePaid)}
                        </div>`;
                    
                    deleteActionCell = `
                        <td class="text-center no-print">
                            <button class="btn btn-sm btn-danger" onclick="deleteIndividualRecord('${log.id}')" title="Delete entry">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </td>`;
                } else {
                    statusAndPaymentCell = `
                        <button class="btn btn-sm btn-outline-warning text-dark fw-semibold no-print" onclick="markAsPaid('${log.id}', ${log.paidBoxes})">
                            <i class="bi bi-hourglass-split me-1"></i> Mark Paid
                        </button>
                        <span class="badge bg-warning text-dark text-uppercase d-none d-print-inline-block">Unpaid</span>`;
                }

                const row = `
                    <tr ${rowClass}>
                        <td>
                            <div class="fw-bold text-dark">${escapeHtml(log.employeeName)}</div>
                            <small class="text-muted text-uppercase font-monospace bg-light border px-1 rounded" style="font-size: 0.75rem;">
                                ${escapeHtml(log.vehiclePlate)}
                            </small>
                        </td>
                        <td class="text-secondary fw-semibold small">${formatDateDisplay(log.dateWorked)}</td>
                        <td class="box-count">
                            <span class="text-muted small">Removed:</span> <strong class="text-dark">${log.totalBoxes}</strong><br>
                            <span class="text-muted small">To Pay:</span> <strong class="text-primary">${log.paidBoxes}</strong>
                        </td>
                        <td>${statusAndPaymentCell}</td>
                        ${deleteActionCell}
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        // Action Function: Instant payout execution synced directly up to cloud nodes
        function markAsPaid(recordId, paidBoxes) {
            const totalEarnings = paidBoxes * 1; 

            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const stringifiedDatePaid = `${year}-${month}-${day}`;

            const paymentUpdates = {
                isPaid: true,
                amountPaid: totalEarnings,
                datePaid: stringifiedDatePaid
            };

            fetch(`${FIREBASE_URL}logs/${recordId}.json`, {
                method: 'PATCH',
                body: JSON.stringify(paymentUpdates),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(() => {
                fetchLogsFromCloud();
            });
        }

        // Action Function: Complete deletion of targeted single document row item
        function deleteIndividualRecord(recordId) {
            if (confirm("Are you sure you want to permanently delete this paid work record from cloud database?")) {
                fetch(`${FIREBASE_URL}logs/${recordId}.json`, {
                    method: 'DELETE'
                })
                .then(() => {
                    fetchLogsFromCloud();
                });
            }
        }

        // Fixed Engine Processing Task Block: PDF Generation Canvas Builder
        function generatePDF() {
            if (globalLogsArray.length === 0) {
                alert("There are no records to export.");
                return;
            }

            const nameFilter = document.getElementById('filterName').value.trim().toLowerCase();
            const startDate = document.getElementById('filterStartDate').value;
            const endDate = document.getElementById('filterEndDate').value;

            // Run conditional validation filter loops
            const filteredLogs = globalLogsArray.filter(log => {
                if (nameFilter && !log.employeeName.toLowerCase().includes(nameFilter)) return false;
                if (startDate && log.dateWorked < startDate) return false;
                if (endDate && log.dateWorked > endDate) return false;
                return true;
            });

            if (filteredLogs.length === 0) {
                alert("No records match your filter choices.");
                return;
            }

            // Lock list visually to matching records only for printing
            displayLogs(filteredLogs);

            const todayStr = new Date().toLocaleDateString('en-GB');
            let metaInfo = `Generated on: ${todayStr}`;
            if (nameFilter) metaInfo += ` | Employee: ${document.getElementById('filterName').value}`;
            if (startDate || endDate) {
                metaInfo += ` | Period: ${startDate ? formatDateDisplay(startDate) : 'Beginning'} to ${endDate ? formatDateDisplay(endDate) : 'Present'}`;
            }
            document.getElementById('pdfMetadata').innerText = metaInfo;

            const element = document.getElementById('pdfPrintArea');
            const pdfHeader = document.getElementById('pdfHeader');
            const pdfFooter = document.getElementById('pdfFooter');
            const actionElements = document.querySelectorAll('.no-print');

            // Temporarily present printing aesthetics blocks
            pdfHeader.style.display = 'block';
            pdfFooter.style.display = 'block';
            actionElements.forEach(el => el.style.display = 'none');

            const options = {
                margin:       10,
                filename:     `Work_Log_Report_${new Date().toISOString().slice(0,10)}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Trigger document download canvas conversion
            html2pdf().set(options).from(element).save()
            .then(() => {
                // Revert interface view cleanly back to operational status dashboard
                pdfHeader.style.display = 'none';
                pdfFooter.style.display = 'none';
                actionElements.forEach(el => el.style.display = '');
                displayLogs(); 
            })
            .catch(err => {
                console.error("PDF Printing Error: ", err);
                // Recovery cleanup fail safe
                pdfHeader.style.display = 'none';
                pdfFooter.style.display = 'none';
                actionElements.forEach(el => el.style.display = '');
                displayLogs();
            });
        }

        // Helper function to turn "YYYY-MM-DD" into "DD/MM/YYYY" display
        function formatDateDisplay(dateString) {
            if (!dateString) return "";
            const parts = dateString.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`; 
            }
            return dateString;
        }

        // Helper function to prevent script injection
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Drop global data nodes
        function clearAllData() {
            if (confirm("Warning: Are you sure you want to clear the entire record cloud database? This resets everything for everyone everywhere.")) {
                fetch(`${FIREBASE_URL}logs.json`, {
                    method: 'DELETE'
                })
                .then(() => {
                    fetchLogsFromCloud();
                });
            }
        }

        // Load collection context immediately
        fetchLogsFromCloud();
    </script>
</body>
</html>
